<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>트렌드 나우 | 릴스·유튜브 화제의 핫플·꿀템·이슈 큐레이션</title>
  <meta name="description" content="실시간 SNS에서 가장 핫한 성수/홍대 맛집, 품절대란 꿀템, 화제의 밈과 이슈를 3분 만에 핵심 정리해 드립니다." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #191f28;
      --text-sub: #4e5968;
      --text-muted: #8b95a1;
      --primary: #ff3b30;
      --primary-soft: #fff1f0;
      --border: #e5e8eb;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }
    .header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 20px; font-weight: 800; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .logo span { color: var(--text); }
    
    .category-bar { max-width: 900px; margin: 20px auto 10px; padding: 0 20px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .category-bar::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--card-bg); font-size: 14px; font-weight: 600; color: var(--text-sub);
      cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
    }
    .cat-btn.active, .cat-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    main { max-width: 900px; margin: 0 auto; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card {
      background: var(--card-bg); border-radius: var(--radius); padding: 24px;
      border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(0,0,0,0.06); }
    .card-badge {
      display: inline-block; padding: 4px 10px; border-radius: 6px;
      background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 700;
      margin-bottom: 12px;
    }
    .card-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; line-height: 1.4; }
    .card-desc { font-size: 14px; color: var(--text-sub); margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; }

    /* Modal / Detail View */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px;
    }
    .modal-content {
      background: #fff; max-width: 760px; width: 100%; max-height: 90vh;
      border-radius: 20px; overflow-y: auto; padding: 32px 24px; position: relative;
    }
    .modal-close {
      position: absolute; top: 20px; right: 20px; font-size: 24px;
      background: none; border: none; cursor: pointer; color: var(--text-muted);
    }
    .post-content h2 { margin: 28px 0 12px; font-size: 20px; font-weight: 700; color: var(--text); border-left: 4px solid var(--primary); padding-left: 10px; }
    .post-content p { margin-bottom: 14px; font-size: 16px; color: #333d4b; line-height: 1.8; }
    .post-content table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 14px; }
    .post-content th, .post-content td { padding: 10px 14px; border: 1px solid var(--border); }
    .post-content th { background: #f2f4f6; }
    
    .loading { text-align: center; padding: 60px; color: var(--text-muted); font-size: 15px; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="logo">🔥 <span>트렌드 나우</span></a>
      <div style="font-size: 13px; color: var(--text-muted);">실시간 핫플·꿀템·이슈</div>
    </div>
  </header>

  <div class="category-bar">
    <button class="cat-btn active" onclick="filterCategory('')">전체</button>
    <button class="cat-btn" onclick="filterCategory('핫플레이스')">🍽️ 핫플레이스/맛집</button>
    <button class="cat-btn" onclick="filterCategory('바이럴쇼핑')">🛍️ 바이럴 꿀템</button>
    <button class="cat-btn" onclick="filterCategory('트렌드이슈')">✨ 트렌드 & 밈</button>
  </div>

  <main>
    <div id="post-list" class="grid">
      <div class="loading">실시간 트렌드 포스트를 불러오는 중입니다...</div>
    </div>
  </main>

  <div id="modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    let currentCategory = '';

    async function loadPosts(cat = '') {
      const listEl = document.getElementById('post-list');
      listEl.innerHTML = '<div class="loading">실시간 트렌드를 동기화 중입니다...</div>';
      try {
        const res = await fetch(`/api/posts${cat ? `?category=${encodeURIComponent(cat)}` : ''}`);
        const data = await res.json();
        if (!data.posts || data.posts.length === 0) {
          listEl.innerHTML = '<div class="loading">아직 발행된 트렌드 글이 없습니다.</div>';
          return;
        }
        listEl.innerHTML = data.posts.map(p => `
          <div class="card" onclick="openPost('${p.ID}')">
            <div>
              <span class="card-badge">${Object.keys(p.categories)[0] || '트렌드'}</span>
              <h3 class="card-title">${p.title}</h3>
              <div class="card-desc">${p.excerpt}</div>
            </div>
            <div class="card-meta">
              <span>${new Date(p.date).toLocaleDateString('ko-KR')}</span>
              <span>자세히 보기 &rarr;</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        listEl.innerHTML = '<div class="loading">포스트를 불러오지 못했습니다.</div>';
      }
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(cat) || (!cat && btn.textContent === '전체'));
      });
      loadPosts(cat);
    }

    async function openPost(id) {
      const modal = document.getElementById('modal');
      const body = document.getElementById('modal-body');
      body.innerHTML = '<div class="loading">글을 불러오는 중...</div>';
      modal.style.display = 'flex';
      try {
        const res = await fetch(`/api/posts?id=${id}`);
        const p = await res.json();
        body.innerHTML = `
          <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 12px; line-height: 1.4;">${p.title}</h1>
          <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">
            발행일: ${new Date(p.date).toLocaleString('ko-KR')} · 카테고리: ${Object.keys(p.categories)[0] || '트렌드'}
          </div>
          <div class="post-content">${p.content}</div>
        `;
      } catch (e) {
        body.innerHTML = '<div class="loading">글을 불러오는 데 실패했습니다.</div>';
      }
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', () => loadPosts());
  </script>
</body>
</html>
